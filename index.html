<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div id="main">
        <div>
           <h3 id="heading">CURRENCY CONVERTER</h3>
        </div>
        <div id="inner">
        <H5>FROM</H5>

        <div class="main_container">

    <div class="container">
        <img src="https://flagsapi.com/US/shiny/64.png">

        <select id="from" >
        </select>
    </div>
    <input type="number" placeholder="00 " >
</div>

        <div id="convert_icon_div" >
            <img id="convert_icon"src="Images/Convert Icon.png">
        </div>


        <h5>TO</h5>

        <div class="main_container">
        <div class="container">
            <img src="https://flagsapi.com/IN/shiny/64.png">
            <select id="to">
        </select>
</div>

        <input type="number" placeholder="00" >
        </div>

        <div id="exchange_box">
       <div id="rate"> EXCHANGE RATE</div>
       <div id="value"> 1 USD = 98.45 Rupess</div>
            </div>

        <div>
        <button>CONVERT</button>
        </div>

        </div>
    </div>
    <div id="Side">
        <img id="side_image" src="Images/currency-converter.png">
    </div>

    <script src="app.js"></script>
    <script src="script.js"></script>

    
</body>
</html>
